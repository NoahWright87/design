name: Publish to npm

# Publishes on every push to main, but only actually runs `npm publish` when
# package.json's version is ahead of what's currently live on the registry.
# Fails the job (without publishing) if package.json has fallen behind the
# published version, so that drift is caught in CI instead of silently
# shipping nothing — see scripts/check-npm-version.mjs.

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Check version and publish
    runs-on: ubuntu-latest
    if: github.repository == 'NoahWright87/design'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check version against npm registry
        id: version-check
        run: node scripts/check-npm-version.mjs

      - name: Typecheck
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm run typecheck

      - name: Build
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish
        if: steps.version-check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
