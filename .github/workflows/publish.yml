name: Publish to npm

# Single workflow so there's only one file to register as this package's
# npm Trusted Publisher (npm only allows one per package). Handles two
# triggers:
#
# - push to main: publishes a real release, but only when package.json's
#   version is ahead of what's currently live on the registry. Fails
#   loudly instead of publishing nothing if it's ever behind — see
#   scripts/check-npm-version.mjs.
# - pull_request: publishes an ephemeral pre-release
#   (<version>-pr<N>.<sha>) under the `pr-<N>` npm dist-tag and comments
#   the install command on the PR, so changes can be tried before
#   merging. Never touches package.json in the repo.
#
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret, just the
# id-token permission below plus a one-time Trusted Publisher
# registration for this workflow filename on the package's npmjs.com
# settings.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  publish:
    name: Check version and publish
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.repository == 'NoahWright87/design') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # --- Release path (push to main) ---
      - name: Check version against npm registry
        if: github.event_name == 'push'
        id: version-check
        run: node scripts/check-npm-version.mjs

      - name: Publish release
        if: github.event_name == 'push' && steps.version-check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      # --- PR preview path ---
      - name: Set pre-release version
        if: github.event_name == 'pull_request'
        id: version
        run: |
          base_version=$(node -p "require('./package.json').version")
          short_sha=$(git rev-parse --short HEAD)
          prerelease_version="${base_version}-pr${{ github.event.pull_request.number }}.${short_sha}"
          npm version "$prerelease_version" --no-git-tag-version
          echo "version=$prerelease_version" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        if: github.event_name == 'pull_request'
        run: npm publish --access public --tag "${{ steps.version.outputs.tag }}" --provenance

      - name: Comment install instructions
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-publish -->';
            const version = '${{ steps.version.outputs.version }}';
            const tag = '${{ steps.version.outputs.tag }}';
            const body = `${marker}\n📦 Published a pre-release build for this PR: \`${version}\`\n\nTry it before merging:\n\n\`\`\`\nnpm install @noahwright/design@${tag}\n\`\`\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
